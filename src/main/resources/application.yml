spring:
  application:
    name: easymonitor

  datasource:
    url: jdbc:h2:mem:easymonitordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  rabbitmq:
    addresses: amqp://Pluris:pluris12345@192.168.0.91:5672
